<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f0f2f5; height: 100vh; display: flex; justify-content: center; align-items: center; }
        #app { background: white; padding: 40px 30px; border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        .logo { text-align: center; margin-bottom: 30px; }
        .logo h1 { font-size: 32px; color: #007AFF; margin-bottom: 5px; }
        .logo p { color: #666; font-size: 14px; }
        .tab { display: flex; margin-bottom: 20px; border-bottom: 2px solid #eee; }
        .tab button { flex: 1; padding: 10px; border: none; background: none; font-size: 16px; cursor: pointer; color: #999; transition: 0.3s; font-weight: 500; }
        .tab button.active { color: #007AFF; border-bottom: 2px solid #007AFF; }
        .form { display: none; }
        .form.active { display: block; }
        input { width: 100%; padding: 12px 15px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 10px; font-size: 16px; outline: none; transition: border 0.3s; }
        input:focus { border-color: #007AFF; }
        .btn { width: 100%; padding: 12px; background: #007AFF; color: white; border: none; border-radius: 10px; font-size: 16px; cursor: pointer; font-weight: 500; transition: background 0.3s; }
        .btn:hover { background: #0055b3; }
        .error { color: red; text-align: center; margin-top: 10px; font-size: 14px; }
        .success { color: green; text-align: center; margin-top: 10px; font-size: 14px; }
    </style>
</head>
<body>
    <div id="app">
        <div class="logo">
            <h1>💬 Nexus</h1>
            <p>Добро пожаловать в Nexus!</p>
        </div>
        <div class="tab">
            <button class="active" onclick="switchTab('login')">Вход</button>
            <button onclick="switchTab('register')">Регистрация</button>
        </div>
        
        <div id="login-form" class="form active">
            <div id="login-error" class="error"></div>
            <input type="text" id="login-username" placeholder="Никнейм">
            <input type="password" id="login-password" placeholder="Пароль">
            <button class="btn" id="login-btn">Войти</button>
        </div>
        
        <div id="register-form" class="form">
            <div id="register-error" class="error"></div>
            <div id="register-success" class="success"></div>
            <input type="text" id="register-username" placeholder="Никнейм">
            <input type="text" id="register-displayname" placeholder="Имя (опционально)">
            <input type="password" id="register-password" placeholder="Пароль">
            <button class="btn" id="register-btn">Зарегистрироваться</button>
        </div>
    </div>

    <script>
        function switchTab(tab) {
            document.querySelectorAll('.form').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab button').forEach(el => el.classList.remove('active'));
            if (tab === 'login') {
                document.getElementById('login-form').classList.add('active');
                document.querySelector('.tab button:first-child').classList.add('active');
            } else {
                document.getElementById('register-form').classList.add('active');
                document.querySelector('.tab button:last-child').classList.add('active');
            }
            document.getElementById('login-error').textContent = '';
            document.getElementById('register-error').textContent = '';
            document.getElementById('register-success').textContent = '';
        }

        document.getElementById('login-btn').addEventListener('click', function(e) {
            e.preventDefault();
            e.stopPropagation();
            
            const username = document.getElementById('login-username').value.trim();
            const password = document.getElementById('login-password').value.trim();
            const errorEl = document.getElementById('login-error');
            
            errorEl.textContent = '';
            if (!username || !password) {
                errorEl.textContent = 'Заполните все поля';
                return;
            }
            
            errorEl.textContent = '⏳ Проверка...';
            errorEl.style.color = '#007AFF';
            
            fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            })
            .then(r => r.json())
            .then(data => {
                console.log('Ответ сервера:', data);
                if (data.status === 'ok' && data.user_id) {
                    window.location.href = '/?user_id=' + data.user_id;
                } else {
                    errorEl.textContent = data.error || 'Неверный логин или пароль';
                    errorEl.style.color = 'red';
                }
            })
            .catch(err => {
                console.error('Ошибка:', err);
                errorEl.textContent = 'Ошибка соединения с сервером';
                errorEl.style.color = 'red';
            });
        });

        document.getElementById('register-btn').addEventListener('click', function(e) {
            e.preventDefault();
            e.stopPropagation();
            
            const username = document.getElementById('register-username').value.trim();
            const display_name = document.getElementById('register-displayname').value.trim();
            const password = document.getElementById('register-password').value.trim();
            const errorEl = document.getElementById('register-error');
            const successEl = document.getElementById('register-success');
            
            errorEl.textContent = '';
            successEl.textContent = '';
            
            if (!username || !password) {
                errorEl.textContent = 'Заполните никнейм и пароль';
                return;
            }
            
            fetch('/api/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password, display_name })
            })
            .then(r => r.json())
            .then(data => {
                console.log('Ответ регистрации:', data);
                if (data.status === 'ok') {
                    successEl.textContent = '✅ Регистрация успешна! Теперь войдите.';
                    document.getElementById('login-username').value = username;
                    setTimeout(() => {
                        switchTab('login');
                        document.getElementById('login-password').value = '';
                    }, 1500);
                } else {
                    errorEl.textContent = data.error || 'Ошибка регистрации';
                }
            })
            .catch(err => {
                console.error('Ошибка:', err);
                errorEl.textContent = 'Ошибка соединения с сервером';
            });
        });

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                const activeForm = document.querySelector('.form.active');
                if (activeForm && activeForm.id === 'login-form') {
                    document.getElementById('login-btn').click();
                } else if (activeForm && activeForm.id === 'register-form') {
                    document.getElementById('register-btn').click();
                }
            }
        });
    </script>
</body>
</html>
