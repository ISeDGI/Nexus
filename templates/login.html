<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, sans-serif; background: #f5f5f5; height: 100vh; display: flex; justify-content: center; align-items: center; }
        #app { background: white; padding: 40px 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        h1 { text-align: center; margin-bottom: 30px; color: #007AFF; }
        .tab { display: flex; margin-bottom: 20px; border-bottom: 2px solid #eee; }
        .tab button { flex: 1; padding: 10px; border: none; background: none; font-size: 16px; cursor: pointer; color: #999; transition: 0.3s; }
        .tab button.active { color: #007AFF; border-bottom: 2px solid #007AFF; }
        .form { display: none; }
        .form.active { display: block; }
        input { width: 100%; padding: 12px 15px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 10px; font-size: 16px; outline: none; }
        input:focus { border-color: #007AFF; }
        button { width: 100%; padding: 12px; background: #007AFF; color: white; border: none; border-radius: 10px; font-size: 16px; cursor: pointer; }
        button:hover { background: #0055b3; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .error { color: red; text-align: center; margin-bottom: 10px; font-size: 14px; }
        .success { color: green; text-align: center; margin-bottom: 10px; font-size: 14px; }
        .loading { color: #007AFF; text-align: center; margin-bottom: 10px; font-size: 14px; display: none; }
    </style>
</head>
<body>
    <div id="app">
        <h1>💬 Чат</h1>
        <div class="tab">
            <button class="active" onclick="switchTab('login')">Вход</button>
            <button onclick="switchTab('register')">Регистрация</button>
        </div>
        <div id="login-form" class="form active">
            <div id="login-error" class="error"></div>
            <div id="login-loading" class="loading">⏳ Вход...</div>
            <input type="text" id="login-username" placeholder="Никнейм">
            <input type="password" id="login-password" placeholder="Пароль">
            <button id="login-btn" onclick="login()">Войти</button>
        </div>
        <div id="register-form" class="form">
            <div id="register-error" class="error"></div>
            <div id="register-success" class="success"></div>
            <input type="text" id="register-username" placeholder="Никнейм">
            <input type="text" id="register-displayname" placeholder="Имя (опционально)">
            <input type="password" id="register-password" placeholder="Пароль">
            <button onclick="register()">Зарегистрироваться</button>
        </div>
    </div>
    <script>
        function switchTab(tab) {
            document.querySelectorAll('.form').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab button').forEach(el => el.classList.remove('active'));
            if (tab === 'login') {
                document.getElementById('login-form').classList.add('active');
                document.querySelector('.tab button:first-child').classList.add('active');
            } else {
                document.getElementById('register-form').classList.add('active');
                document.querySelector('.tab button:last-child').classList.add('active');
            }
            document.getElementById('login-error').textContent = '';
            document.getElementById('register-error').textContent = '';
            document.getElementById('register-success').textContent = '';
            document.getElementById('login-loading').style.display = 'none';
        }

        async function login() {
            const username = document.getElementById('login-username').value.trim();
            const password = document.getElementById('login-password').value.trim();
            const errorEl = document.getElementById('login-error');
            const loadingEl = document.getElementById('login-loading');
            const btn = document.getElementById('login-btn');
            
            errorEl.textContent = '';
            
            if (!username || !password) {
                errorEl.textContent = 'Заполните все поля';
                return;
            }
            
            console.log('🔑 Пытаемся войти:', username);
            loadingEl.style.display = 'block';
            btn.disabled = true;
            btn.textContent = '⏳...';
            
            try {
                const resp = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                
                const data = await resp.json();
                console.log('📨 Ответ сервера:', data);
                
                if (resp.ok) {
                    console.log('✅ Вход успешен! Перенаправляем...');
                    // === ПЕРЕНАПРАВЛЕНИЕ ===
                    window.location.replace('/');
                } else {
                    errorEl.textContent = data.error || 'Неверный логин или пароль';
                    loadingEl.style.display = 'none';
                    btn.disabled = false;
                    btn.textContent = 'Войти';
                }
            } catch (e) {
                console.error('❌ Ошибка:', e);
                errorEl.textContent = 'Ошибка соединения с сервером';
                loadingEl.style.display = 'none';
                btn.disabled = false;
                btn.textContent = 'Войти';
            }
        }

        async function register() {
            const username = document.getElementById('register-username').value.trim();
            const display_name = document.getElementById('register-displayname').value.trim();
            const password = document.getElementById('register-password').value.trim();
            const errorEl = document.getElementById('register-error');
            const successEl = document.getElementById('register-success');
            
            errorEl.textContent = '';
            successEl.textContent = '';
            
            if (!username || !password) {
                errorEl.textContent = 'Заполните никнейм и пароль';
                return;
            }
            
            console.log('📝 Регистрируем:', username);
            
            try {
                const resp = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password, display_name })
                });
                
                const data = await resp.json();
                console.log('📨 Ответ:', data);
                
                if (resp.ok) {
                    successEl.textContent = '✅ Регистрация успешна! Теперь войдите.';
                    document.getElementById('login-username').value = username;
                    setTimeout(() => {
                        switchTab('login');
                        document.getElementById('login-password').value = '';
                    }, 1500);
                } else {
                    errorEl.textContent = data.error || 'Ошибка регистрации';
                }
            } catch (e) {
                console.error('❌ Ошибка:', e);
                errorEl.textContent = 'Ошибка соединения с сервером';
            }
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                const activeForm = document.querySelector('.form.active');
                if (activeForm.id === 'login-form') login();
                else if (activeForm.id === 'register-form') register();
            }
        });
    </script>
</body>
</html>
