<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой Чат</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
</head>
<body>
    <div id="app">
        <div id="header">
            <h1>💬 Мой Чат</h1>
            <input type="text" id="username" placeholder="Ваше имя" value="User{{ range(1, 100) | random }}">
        </div>
        
        <div id="messages">
            <!-- Сообщения будут появляться здесь -->
        </div>
        
        <div id="input-area">
            <input type="text" id="msg-input" placeholder="Введите сообщение...">
            <button id="send-btn">➤</button>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/static/service-worker.js')
                .then(() => console.log('SW зарегистрирован'));
        }
    </script>
</body>
</html>
