<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, sans-serif; background: #e5ddd5; height: 100vh; }
        #app { display: flex; flex-direction: column; height: 100vh; max-width: 1200px; margin: 0 auto; background: white; }
        #header { background: #007AFF; color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
        #header h1 { font-size: 20px; margin: 0; }
        #header button { background: rgba(255,255,255,0.2); border: none; color: white; padding: 6px 12px; border-radius: 10px; cursor: pointer; font-size: 14px; }
        #header button:hover { background: rgba(255,255,255,0.3); }
        #header .header-user { display: flex; align-items: center; gap: 10px; }
        .chat-avatar { width: 40px; height: 40px; border-radius: 50%; background: #007AFF; color: white; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 16px; flex-shrink: 0; overflow: hidden; }
        .chat-avatar img { width: 100%; height: 100%; object-fit: cover; }
        #header-avatar { width: 32px; height: 32px; font-size: 14px; cursor: pointer; }
        #main { display: flex; flex: 1; overflow: hidden; }
        #chat-list { width: 300px; background: #f8f9fa; border-right: 1px solid #ddd; display: flex; flex-direction: column; }
        #search-area { padding: 10px; border-bottom: 1px solid #ddd; }
        #search-input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 20px; outline: none; }
        #search-input:focus { border-color: #007AFF; }
        #search-results { background: white; border: 1px solid #ddd; border-radius: 10px; max-height: 200px; overflow-y: auto; display: none; }
        .result-item { padding: 10px; cursor: pointer; border-bottom: 1px solid #eee; display: flex; align-items: center; gap: 10px; }
        .result-item:hover { background: #f5f5f5; }
        #chats { flex: 1; overflow-y: auto; padding: 10px; }
        #chats h3 { font-size: 12px; color: #999; margin: 10px 0 5px; }
        .chat-item { padding: 10px; border-radius: 10px; cursor: pointer; margin-bottom: 5px; display: flex; align-items: center; gap: 10px; }
        .chat-item:hover { background: #f5f5f5; }
        .chat-item.active { background: #e3f2fd; }
        #create-group-btn { width: 100%; padding: 10px; background: #007AFF; color: white; border: none; cursor: pointer; }
        #create-group-btn:hover { background: #0055b3; }
        #chat-window { flex: 1; display: flex; flex-direction: column; background: #e5ddd5; }
        #chat-header { padding: 15px 20px; background: white; border-bottom: 1px solid #ddd; font-weight: bold; flex-shrink: 0; display: flex; align-items: center; gap: 10px; }
        #chat-header .chat-avatar { width: 32px; height: 32px; font-size: 14px; cursor: pointer; flex-shrink: 0; }
        #current-chat-name { cursor: pointer; flex: 1; }
        #current-chat-name:hover { color: #007AFF; }
        #group-info-btn { margin-left: auto; background: none; border: none; font-size: 18px; cursor: pointer; display: none; color: #007AFF; }
        #group-info-btn:hover { color: #0055b3; }
        #messages { flex: 1; padding: 15px; overflow-y: auto; }
        .message { padding: 10px 15px; border-radius: 15px; margin-bottom: 10px; max-width: 70%; }
        .message.own { margin-left: auto; background: #dcf8c6; }
        .message.other { background: white; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .msg-username { font-weight: bold; color: #007AFF; margin-right: 10px; font-size: 13px; }
        .message.own .msg-username { color: #1a7a3a; }
        .msg-time { float: right; color: #999; font-size: 11px; margin-left: 15px; }
        #input-area { display: flex; padding: 15px; background: white; border-top: 1px solid #ddd; flex-shrink: 0; gap: 8px; }
        #input-area input { flex: 1; padding: 12px 15px; border: 1px solid #ddd; border-radius: 25px; font-size: 16px; outline: none; }
        #input-area input:focus { border-color: #007AFF; }
        #input-area button { width: 50px; height: 50px; border: none; border-radius: 50%; background: #007AFF; color: white; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        #input-area button:hover { background: #0055b3; }
        #attach-btn, #record-btn { background: transparent !important; color: #495057 !important; font-size: 20px !important; width: 40px !important; }
        #attach-btn:hover, #record-btn:hover { background: #f1f3f5 !important; }
        #record-btn.recording { background: #dc3545 !important; color: white !important; animation: pulse 1s infinite; }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.15); } }
        #group-modal, #profile-modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; }
        #group-modal > div, #profile-modal > div { background: white; padding: 30px; border-radius: 20px; max-width: 400px; width: 90%; max-height: 90vh; overflow-y: auto; }
        #group-modal input, #profile-modal input, #profile-modal textarea { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 10px; }
        #group-modal button, #profile-modal button { padding: 10px; border: none; border-radius: 10px; cursor: pointer; }
        #profile-modal .avatar-preview { width: 80px; height: 80px; border-radius: 50%; margin: 0 auto 15px; display: flex; align-items: center; justify-content: center; background: #007AFF; color: white; font-size: 32px; overflow: hidden; cursor: pointer; }
        #profile-modal .avatar-preview img { width: 100%; height: 100%; object-fit: cover; }
        .unread-badge { display: inline-block; background: #007AFF; color: white; font-size: 11px; font-weight: bold; border-radius: 50%; min-width: 20px; height: 20px; line-height: 20px; text-align: center; padding: 0 6px; margin-left: 8px; }
        @media (max-width: 768px) {
            #chat-list { width: 100%; max-height: 40vh; border-right: none; border-bottom: 1px solid #ddd; }
            #main { flex-direction: column; }
            .message { max-width: 85%; }
        }
    </style>
</head>
<body>
    <div id="app">
        <div id="header">
            <h1>💬 Nexus</h1>
            <div class="header-user">
                <span id="username-display">{{ username }}</span>
                <div class="chat-avatar" id="header-avatar" style="width:32px;height:32px;font-size:14px;cursor:pointer;" onclick="showProfile()">👤</div>
                <button onclick="logout()">Выйти</button>
            </div>
        </div>
        <div id="main">
            <div id="chat-list">
                <div id="search-area">
                    <input type="text" id="search-input" placeholder="🔍 Поиск">
                    <div id="search-results"></div>
                </div>
                <div id="chats">
                    <h3>Личные чаты</h3>
                    <div id="private-chats"></div>
                    <h3>Группы</h3>
                    <div id="group-chats"></div>
                </div>
                <button onclick="showCreateGroup()" id="create-group-btn">+ Создать группу</button>
            </div>
            <div id="chat-window">
                <div id="chat-header">
                    <div class="chat-avatar" id="chat-avatar" onclick="showUserProfile(currentChatUserId)" style="cursor:pointer;">👤</div>
                    <span id="current-chat-name" onclick="showUserProfile(currentChatUserId)" style="cursor:pointer;">Выберите чат</span>
                    <button id="group-info-btn" onclick="showGroupInfo()" title="Информация о группе">ℹ️</button>
                </div>
                <div id="messages"></div>
                <div id="input-area">
                    <input type="file" id="file-input" style="display:none" multiple>
                    <button id="attach-btn" title="Прикрепить файл">📎</button>
                    <button id="record-btn" title="Голосовое сообщение">🎤</button>
                    <input type="text" id="msg-input" placeholder="Сообщение...">
                    <button id="send-btn">➤</button>
                </div>
            </div>
        </div>
    </div>
    <div id="group-modal">
        <div>
            <h2>Создать группу</h2>
            <input type="text" id="group-name" placeholder="Название группы">
            <div style="margin-top:10px;font-weight:500;">Выберите участников:</div>
            <div id="group-members-list" style="max-height:200px;overflow-y:auto;margin:10px 0;"></div>
            <button onclick="createGroup()" style="width:100%;padding:10px;background:#007AFF;color:white;border:none;border-radius:10px;cursor:pointer;">Создать</button>
            <button onclick="closeModal()" style="width:100%;padding:10px;background:#eee;border:none;border-radius:10px;cursor:pointer;margin-top:5px;">Отмена</button>
        </div>
    </div>
    <div id="profile-modal">
        <div>
            <h2 id="profile-title">Профиль</h2>
            <div id="profile-content"></div>
            <button onclick="closeProfile()" style="width:100%;padding:10px;background:#eee;border:none;border-radius:10px;cursor:pointer;margin-top:10px;">Закрыть</button>
        </div>
    </div>
    <script>
        window.userId = {{ user_id }};
        console.log('✅ userId из HTML:', window.userId);
    </script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
