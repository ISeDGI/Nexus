<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой Чат</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
</head>
<body>
    <div id="app">
        <!-- Шапка -->
        <div id="header">
            <h1>💬 Чат</h1>
            <div>
                <span id="username-display">{{ username }}</span>
                <button onclick="logout()" style="margin-left:10px;background:none;border:1px solid white;color:white;padding:5px 10px;border-radius:5px;cursor:pointer;">Выйти</button>
            </div>
        </div>
        
        <!-- Основная часть -->
        <div id="main">
            <!-- Список чатов (слева) -->
            <div id="chat-list">
                <div id="search-area">
                    <input type="text" id="search-input" placeholder="🔍 Поиск пользователей...">
                    <div id="search-results"></div>
                </div>
                <div id="chats">
                    <h3>Личные чаты</h3>
                    <div id="private-chats"></div>
                    <h3>Группы</h3>
                    <div id="group-chats"></div>
                </div>
                <button onclick="showCreateGroup()" style="width:100%;padding:10px;background:#007AFF;color:white;border:none;border-radius:10px;cursor:pointer;">+ Создать группу</button>
            </div>
            
            <!-- Окно чата (справа) -->
            <div id="chat-window">
                <div id="chat-header">
                    <span id="current-chat-name">Выберите чат</span>
                </div>
                <div id="messages">
                    <!-- Сообщения -->
                </div>
                <div id="input-area">
                    <input type="text" id="msg-input" placeholder="Введите сообщение...">
                    <button id="send-btn">➤</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Модалка создания группы -->
    <div id="group-modal" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);justify-content:center;align-items:center;z-index:1000;">
        <div style="background:white;padding:30px;border-radius:20px;max-width:400px;width:90%;">
            <h2>Создать группу</h2>
            <input type="text" id="group-name" placeholder="Название группы" style="width:100%;padding:10px;margin:10px 0;border:1px solid #ddd;border-radius:10px;">
            <div id="group-members-list" style="max-height:200px;overflow-y:auto;margin:10px 0;"></div>
            <button onclick="createGroup()" style="width:100%;padding:10px;background:#007AFF;color:white;border:none;border-radius:10px;cursor:pointer;">Создать</button>
            <button onclick="closeModal()" style="width:100%;padding:10px;background:#eee;border:none;border-radius:10px;cursor:pointer;margin-top:5px;">Отмена</button>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/static/service-worker.js')
                .then(() => console.log('SW зарегистрирован'));
        }
    </script>
</body>
</html>
