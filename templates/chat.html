<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Мой Чат</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div id="app">
        <div id="header">
            <h1>💬 Чат</h1>
            <div id="header-right">
                <span id="username-display">{{ username }}</span>
                <button onclick="showProfile()">👤</button>
                <button onclick="logout()">Выйти</button>
            </div>
        </div>
        
        <div id="main">
            <div id="chat-list">
                <div id="search-area">
                    <input type="text" id="search-input" placeholder="🔍 Поиск пользователей...">
                    <div id="search-results"></div>
                </div>
                <div id="chats">
                    <h3>Личные чаты</h3>
                    <div id="private-chats"></div>
                    <h3>Группы</h3>
                    <div id="group-chats"></div>
                </div>
                <button onclick="showCreateGroup()" id="create-group-btn">+ Создать группу</button>
            </div>
            
            <div id="chat-window">
                <div id="chat-header">
                    <div class="chat-avatar" id="chat-avatar">👤</div>
                    <span id="current-chat-name">Выберите чат</span>
                </div>
                <div id="messages"></div>
                <div id="input-area">
                    <button id="attach-btn">📎</button>
                    <button id="record-btn">🎤</button>
                    <input type="file" id="file-input" style="display:none" multiple>
                    <input type="text" id="msg-input" placeholder="Введите сообщение...">
                    <button id="send-btn">➤</button>
                </div>
            </div>
        </div>
    </div>

    <div id="group-modal" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);justify-content:center;align-items:center;z-index:1000;">
        <div style="background:white;padding:30px;border-radius:20px;max-width:400px;width:90%;max-height:80vh;overflow-y:auto;">
            <h2>Создать группу</h2>
            <input type="text" id="group-name" placeholder="Название группы" style="width:100%;padding:10px;margin:10px 0;border:1px solid #ddd;border-radius:10px;">
            <div id="group-members-list" style="max-height:200px;overflow-y:auto;margin:10px 0;"></div>
            <button onclick="createGroup()" style="width:100%;padding:10px;background:#25D366;color:white;border:none;border-radius:10px;cursor:pointer;">Создать</button>
            <button onclick="closeModal()" style="width:100%;padding:10px;background:#eee;border:none;border-radius:10px;cursor:pointer;margin-top:5px;">Отмена</button>
        </div>
    </div>

    <div id="profile-modal" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);justify-content:center;align-items:center;z-index:1000;">
        <div style="background:white;padding:30px;border-radius:20px;max-width:400px;width:90%;">
            <h2 id="profile-title">Профиль</h2>
            <div id="profile-content"></div>
            <button onclick="closeProfile()" style="width:100%;padding:10px;background:#eee;border:none;border-radius:10px;cursor:pointer;margin-top:10px;">Закрыть</button>
        </div>
    </div>

    <script>
        window.userId = {{ user_id }};
    </script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
